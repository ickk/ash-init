[workspace]
resolver = "3"
members = ["ash-init"]

[workspace.dependencies]
ash = { version = "0.38", default-features = false }
raw-window-handle = { version = "0.6", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
winit = { version = "0.30", default-features = false }
x11 = { version = "2.21", default-features = false }
xcb = { version = "1.4", default-features = false }

[workspace.lints]
rust.unsafe_op_in_unsafe_fn = "deny"
clippy.new_without_default = "allow"
clippy.toplevel_ref_arg = "allow"
clippy.too_many_arguments = "allow"
clippy.match_ref_pats = "allow"
clippy.needless_return = "allow"
clippy.inconsistent_digit_grouping = "allow"
clippy.enum_variant_names = "allow"
clippy.module_inception = "allow"

[profile.dev.package."*"]
opt-level = 3
